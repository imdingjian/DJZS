                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">國定假日加倍倍率</label>
                                    <input type="number" step="0.1" id="pt-holiday-mult" value="${settings.holidayRateMultiplier}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition shadow-sm">
                                    儲存兼職設定
                                </button>
                            </form>
                        </div>

                        <!-- Part Time Log -->
                        <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                    <i data-lucide="briefcase" class="w-5 h-5 text-indigo-500"></i> 兼職排班與薪資試算
                                </h3>
                                <button onclick="app.openPartTimeModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 transition flex items-center gap-2 shadow-sm">
                                    <i data-lucide="plus" class="w-4 h-4"></i> 新增兼職紀錄
                                </button>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="border-b border-slate-100 text-xs font-semibold text-slate-400">
                                            <th class="py-3 px-2">日期</th>
                                            <th class="py-3 px-2">上班時段安排</th>
                                            <th class="py-3 px-2">實際工時</th>
                                            <th class="py-3 px-2">國定雙倍</th>
                                            <th class="py-3 px-2">試算金額</th>
                                            <th class="py-3 px-2">備註</th>
                                            <th class="py-3 px-2 text-right">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 text-sm">
                                        ${records.length === 0 ? `
                                            <tr><td colspan="7" class="py-8 text-center text-slate-400 text-sm">當月尚無兼職紀錄</td></tr>
                                        ` : records.map(rec => {
                                            const rate = rec.isNationalHoliday ? settings.hourlyRate * settings.holidayRateMultiplier : settings.hourlyRate;
                                            const total = rec.hours * rate;
                                            return `
                                                <tr class="hover:bg-slate-50/50 transition">
                                                    <td class="py-3 px-2 font-medium text-slate-800">${rec.date}</td>
                                                    <td class="py-3 px-2">
                                                        <div class="flex items-center gap-1.5">
                                                            <span class="px-2 py-0.5 rounded text-xs bg-slate-100 font-semibold text-slate-700">${rec.shiftType || '自訂'}</span>
                                                            <span class="text-xs font-medium text-indigo-600">${rec.shiftTime || '-'}</span>
                                                        </div>
                                                    </td>
                                                    <td class="py-3 px-2 font-semibold text-slate-700">${rec.hours} 小時</td>
                                                    <td class="py-3 px-2">
                                                        ${rec.isNationalHoliday ? '<span class="px-2 py-0.5 rounded-full text-xs bg-amber-100 text-amber-800 font-bold">是</span>' : '<span class="text-xs text-slate-400">否</span>'}
                                                    </td>
                                                    <td class="py-3 px-2 font-bold text-indigo-600">$${Math.round(total).toLocaleString()}</td>
                                                    <td class="py-3 px-2 text-slate-500 text-xs max-w-[120px] truncate">${rec.memo || '-'}</td>
                                                    <td class="py-3 px-2 text-right">
                                                        <button onclick="app.deletePartTimeRecord('${rec.id}')" class="p-1 text-slate-400 hover:text-rose-600 transition">
                                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderScheduleAndIncomeView() {
                const monthPrefix = `${this.data.currentYear}-${String(this.data.currentMonth + 1).padStart(2, '0')}`;
                
                const schedules = this.data.schedules
                    .filter(s => s.date.startsWith(monthPrefix))
                    .sort((a,b) => a.date.localeCompare(b.date));

                const extraIncomes = this.data.extraIncomes
                    .filter(e => e.date.startsWith(monthPrefix))
                    .sort((a,b) => a.date.localeCompare(b.date));

                const categoryColors = {
                    Trip: 'bg-emerald-100 text-emerald-800 border-emerald-200',
                    Friends: 'bg-sky-100 text-sky-800 border-sky-200',
                    Family: 'bg-purple-100 text-purple-800 border-purple-200',
                    Tasks: 'bg-amber-100 text-amber-800 border-amber-200',
                    Other: 'bg-slate-100 text-slate-800 border-slate-200'
                };

                return `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Section 1: Schedule Management -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-6">
                                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <i data-lucide="calendar" class="w-5 h-5 text-amber-500"></i> 行程規劃
                                    </h3>
                                    <button onclick="app.openScheduleModal()" class="px-3 py-1.5 bg-amber-500 text-white rounded-xl text-xs font-semibold hover:bg-amber-600 transition flex items-center gap-1.5 shadow-sm">
                                        <i data-lucide="plus" class="w-4 h-4"></i> 新增行程
                                    </button>
                                </div>

                                <div class="space-y-3">
                                    ${schedules.length === 0 ? `
                                        <div class="py-8 text-center text-slate-400 text-sm">當月尚無行程規劃</div>
                                    ` : schedules.map(sch => `
                                        <div class="p-3.5 rounded-xl border border-slate-100 hover:shadow-sm transition flex items-center justify-between">
                                            <div class="space-y-1.5">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <span class="text-xs px-2 py-0.5 rounded-full border font-medium ${categoryColors[sch.category] || categoryColors.Other}">
                                                        ${sch.category}
                                                    </span>
                                                    <span class="text-xs font-semibold text-slate-400">${sch.date}</span>
                                                    <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200/60">
                                                        <i data-lucide="clock" class="w-3 h-3 inline mr-1"></i>${sch.timeSlotType || '全天'} ${sch.timeSlot ? `(${sch.timeSlot})` : ''}
                                                    </span>
                                                </div>
                                                <div class="text-sm font-bold text-slate-800">${sch.title}</div>
                                                ${sch.memo ? `<div class="text-xs text-slate-500">${sch.memo}</div>` : ''}
                                            </div>
                                            <div class="flex items-center gap-1">
                                                <button onclick="app.openScheduleModal('${sch.id}')" class="p-1.5 text-slate-400 hover:text-amber-600 transition" title="編輯行程">
                                                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                                                </button>
                                                <button onclick="app.deleteSchedule('${sch.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 transition" title="刪除行程">
                                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- Section 2: Daily Extra Income -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-6">
                                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <i data-lucide="bike" class="w-5 h-5 text-emerald-500"></i> 當日額外收入 (外送/小費)
                                    </h3>
                                    <button onclick="app.openExtraIncomeModal()" class="px-3 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-semibold hover:bg-emerald-700 transition flex items-center gap-1.5 shadow-sm">
                                        <i data-lucide="plus" class="w-4 h-4"></i> 紀錄當日收入
                                    </button>
                                </div>

                                <div class="space-y-3">
                                    ${extraIncomes.length === 0 ? `
                                        <div class="py-8 text-center text-slate-400 text-sm">當月尚無當日額外收入紀錄</div>
                                    ` : extraIncomes.map(inc => {
                                        const sum = (inc.foodDelivery || 0) + (inc.tips || 0) + (inc.other || 0);
                                        return `
                                            <div class="p-3 rounded-xl border border-slate-100 hover:shadow-sm transition flex items-center justify-between">
                                                <div class="space-y-1">
                                                    <div class="text-xs font-semibold text-slate-400">${inc.date}</div>
                                                    <div class="text-sm font-bold text-emerald-600">+ NT$ ${sum.toLocaleString()}</div>
                                                    <div class="text-xs text-slate-500 flex gap-2">
                                                        <span>外送: $${inc.foodDelivery||0}</span>
                                                        <span>小費: $${inc.tips||0}</span>
                                                        <span>其他: $${inc.other||0}</span>
                                                    </div>
                                                    ${inc.memo ? `<div class="text-xs text-slate-400 italic">${inc.memo}</div>` : ''}
                                                </div>
                                                <button onclick="app.deleteExtraIncome('${inc.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 transition">
                                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderCommunityView() {
                const stats = this.getMonthlyCalculations();
                const yearPrefix = `${this.data.currentYear}-`;

                const records = this.data.communityRecords
                    .filter(r => r.date.startsWith(yearPrefix))
                    .sort((a,b) => b.date.localeCompare(a.date));

                const pendingRecords = records.filter(r => r.status === 'pending');
                const completedRecords = records.filter(r => r.status === 'completed');

                const annualProgress = Math.min(100, Math.round((stats.annualCsHours / stats.csTarget) * 100));

                return `
                    <div class="space-y-6">
                        <!-- Community Service Dashboard Card -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                                <div>
                                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                        <i data-lucide="heart-handshake" class="w-5 h-5 text-emerald-500"></i>
                                        社會勞動服務進度看板
                                    </h3>
                                    <p class="text-xs text-slate-500">「當月預計時數」為 pending 狀態之安排，點擊「確認完成」即可核入累積時數</p>
                                </div>
                                <div class="flex items-center gap-3">
                                    <button onclick="app.openCsTargetModal()" class="px-3 py-1.5 text-xs border border-slate-200 rounded-xl hover:bg-slate-50 font-medium transition">
                                        設定年度目標 (${stats.csTarget}h)
                                    </button>
                                    <button onclick="app.openCommunityModal()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-semibold hover:bg-emerald-700 transition flex items-center gap-2 shadow-sm">
                                        <i data-lucide="plus" class="w-4 h-4"></i> 新增社勞紀錄
                                    </button>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 my-4 p-4 bg-slate-50 rounded-xl border border-slate-100">
                                <div>
                                    <span class="text-xs text-slate-500 font-medium">當月預計時數 (Pending)</span>
                                    <div class="text-2xl font-bold text-amber-600 mt-1">${stats.monthlyPendingCsHours} 小時</div>
                                </div>
                                <div>
                                    <span class="text-xs text-slate-500 font-medium">當月已完成 (Completed)</span>
                                    <div class="text-2xl font-bold text-emerald-600 mt-1">${stats.monthlyCsHours} 小時</div>
                                </div>
                                <div>
                                    <span class="text-xs text-slate-500 font-medium">年度總已核入</span>
                                    <div class="text-2xl font-bold text-slate-800 mt-1">${stats.annualCsHours} 小時</div>
                                </div>
                                <div>
                                    <span class="text-xs text-slate-500 font-medium">年度目標剩餘</span>
                                    <div class="text-2xl font-bold text-indigo-600 mt-1">${Math.max(0, stats.csTarget - stats.annualCsHours)} 小時</div>
                                </div>
                                <div>
                                    <span class="text-xs text-slate-500 font-medium">年度完成度</span>
                                    <div class="text-2xl font-bold text-brand-600 mt-1">${annualProgress}%</div>
                                </div>
                            </div>

                            <div class="space-y-1">
                                <div class="flex justify-between text-xs font-semibold text-slate-500">
                                    <span>年度進度條 (僅計算已核入實際時數)</span>
                                    <span>${stats.annualCsHours} / ${stats.csTarget} 小時</span>
                                </div>
                                <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                                    <div class="bg-gradient-to-r from-emerald-500 to-teal-600 h-full rounded-full transition-all duration-500" style="width: ${annualProgress}%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Records List Section -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <!-- Pending CS -->
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h4 class="text-md font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> 預計安排 (Pending)
                                </h4>
                                <div class="space-y-3">
                                    ${pendingRecords.length === 0 ? `
                                        <div class="py-8 text-center text-slate-400 text-sm">目前無待完成的預計安排</div>
                                    ` : pendingRecords.map(rec => `
                                        <div class="p-4 rounded-xl border border-amber-200 bg-amber-50/30 flex items-center justify-between gap-4">
                                            <div class="space-y-1">
                                                <div class="flex items-center gap-2">
                                                    <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800">
                                                        預計：${rec.hours} 小時
                                                    </span>
                                                    <span class="text-xs text-slate-400 font-medium">${rec.date}</span>
                                                </div>
                                                <div class="text-sm font-bold text-slate-800">${rec.title}</div>
                                                ${rec.memo ? `<div class="text-xs text-slate-500">${rec.memo}</div>` : ''}
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <button onclick="app.confirmCsCompletion('${rec.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold transition shadow-sm whitespace-nowrap">
                                                    確認完成（核入時數）
                                                </button>
                                                <button onclick="app.deleteCommunityRecord('${rec.id}')" class="p-1 text-slate-400 hover:text-rose-600 transition">
                                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Completed CS -->
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h4 class="text-md font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 已完成紀錄 (Completed)
                                </h4>
                                <div class="space-y-3">
                                    ${completedRecords.length === 0 ? `
                                        <div class="py-8 text-center text-slate-400 text-sm">年度尚無已核入的完成紀錄</div>
                                    ` : completedRecords.map(rec => `
                                        <div class="p-4 rounded-xl border border-emerald-100 bg-emerald-50/20 flex items-center justify-between gap-4">
                                            <div class="space-y-1">
                                                <div class="flex items-center gap-2">
                                                    <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">
                                                        已核入：${rec.hours} 小時
                                                    </span>
                                                    <span class="text-xs text-slate-400 font-medium">${rec.date}</span>
                                                </div>
                                                <div class="text-sm font-bold text-slate-800">${rec.title}</div>${rec.memo ? `<div class="text-xs text-slate-500">${rec.memo}</div>` : ''}
                                            </div>
                                            <button onclick="app.deleteCommunityRecord('${rec.id}')" class="p-1 text-slate-400 hover:text-rose-600 transition">
                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            saveWorkSettings(e) {
                e.preventDefault();
                this.data.workSettings.onboardingDate = document.getElementById('ws-onboarding').value;
                this.data.workSettings.monthlySalary = parseFloat(document.getElementById('ws-salary').value) || 0;
                this.data.workSettings.dailyHours = parseFloat(document.getElementById('ws-hours').value) || 8;
                this.data.workSettings.laborInsuranceDeduction = parseFloat(document.getElementById('ws-labor').value) || 0;
                this.data.workSettings.healthInsuranceDeduction = parseFloat(document.getElementById('ws-health').value) || 0;
                this.data.workSettings.overtimeRate1 = parseFloat(document.getElementById('ws-ot1').value) || 1.34;
                this.data.workSettings.restDayRate1 = parseFloat(document.getElementById('ws-rest1').value) || 1.34;
                this.data.workSettings.restDayRate2 = parseFloat(document.getElementById('ws-rest2').value) || 1.67;
                this.saveState();
                showToast('工作薪資、入職日期與勞健保設定已更新', 'check-circle');
            }

            openWorkRecordModal() {
                const todayStr = DateUtils.formatYMD(new Date());
                openModal(`
                    <h3 class="text-lg font-bold text-slate-800 mb-4">新增/更新 出勤與加班紀錄</h3>
                    <form onsubmit="app.saveWorkRecord(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">日期</label>
                            <input type="date" id="m-work-date" value="${todayStr}" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">出勤類型</label>
                            <select id="m-work-type" onchange="app.toggleWorkModalType(this.value)" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
                                <option value="work">正常上班</option>
                                <option value="rest_overtime">休息日加班</option>
                                <option value="leave">休假 / 請假</option>
                            </select>
                        </div>

                        <!-- Normal Work -->
                        <div id="m-work-fields" class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">上班時間</label>
                                <input type="time" id="m-work-in" value="09:00" class="w-full px-3 py-2 border rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">下班時間</label>
                                <input type="time" id="m-work-out" value="18:00" class="w-full px-3 py-2 border rounded-xl text-sm">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">平日加班時數 (小時)</label>
                                <input type="number" step="0.5" id="m-work-ot" value="0" class="w-full px-3 py-2 border rounded-xl text-sm">
                            </div>
                        </div>

                        <!-- Rest Day Overtime -->
                        <div id="m-rest-fields" class="hidden">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">休息日加班總時數 (小時)</label>
                            <input type="number" step="0.5" id="m-rest-hours" placeholder="請輸入當日加班幾小時" class="w-full px-3 py-2 border rounded-xl text-sm">
                            <p class="text-[11px] text-purple-600 mt-1">自動依設定將前2小時與3-8小時帶入加成比例試算</p>
                        </div>

                        <!-- Leave -->
                        <div id="m-leave-fields" class="hidden">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">假別</label>
                            <select id="m-leave-type" class="w-full px-3 py-2 border rounded-xl text-sm">
                                <option value="特休">特休</option>
                                <option value="病假">病假</option>
                                <option value="事假">事假</option>
                                <option value="補休">補休</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">備忘錄</label>
                            <input type="text" id="m-work-memo" placeholder="備註內容..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl text-sm font-medium">取消</button>
                            <button type="submit" class="px-4 py-2 bg-brand-500 text-white rounded-xl text-sm font-semibold">儲存紀錄</button>
                        </div>
                    </form>
                `);
            }

            toggleWorkModalType(val) {
                const wFields = document.getElementById('m-work-fields');
                const rFields = document.getElementById('m-rest-fields');
                const lFields = document.getElementById('m-leave-fields');

                wFields.classList.add('hidden');
                rFields.classList.add('hidden');
                lFields.classList.add('hidden');

                if (val === 'work') wFields.classList.remove('hidden');
                else if (val === 'rest_overtime') rFields.classList.remove('hidden');
                else if (val === 'leave') lFields.classList.remove('hidden');
            }

            saveWorkRecord(e) {
                e.preventDefault();
                const date = document.getElementById('m-work-date').value;
                const type = document.getElementById('m-work-type').value;

                if (type === 'work') {
                    this.data.workRecords[date] = {
                        type: 'work',
                        checkIn: document.getElementById('m-work-in').value,
                        checkOut: document.getElementById('m-work-out').value,
                        overtimeHours: parseFloat(document.getElementById('m-work-ot').value) || 0,
                        memo: document.getElementById('m-work-memo').value
                    };
                } else if (type === 'rest_overtime') {
                    this.data.workRecords[date] = {
                        type: 'rest_overtime',
                        restDayHours: parseFloat(document.getElementById('m-rest-hours').value) || 0,
                        memo: document.getElementById('m-work-memo').value
                    };
                } else {
                    this.data.workRecords[date] = {
                        type: 'leave',
                        leaveType: document.getElementById('m-leave-type').value,
                        memo: document.getElementById('m-work-memo').value
                    };
                }
                closeModal();
                this.saveState();
                showToast('已更新工作紀錄', 'check-circle');
            }

            deleteWorkRecord(date) {
                delete this.data.workRecords[date];
                this.saveState();
                showToast('已刪除工作紀錄', 'trash-2');
            }

            savePartTimeSettings(e) {
                e.preventDefault();
                this.data.partTimeSettings.hourlyRate = parseFloat(document.getElementById('pt-rate').value) || 0;
                this.data.partTimeSettings.holidayRateMultiplier = parseFloat(document.getElementById('pt-holiday-mult').value) || 2.0;
                this.saveState();
                showToast('兼職設定已儲存', 'check-circle');
            }

            openPartTimeModal() {
                const todayStr = DateUtils.formatYMD(new Date());
                openModal(`
                    <h3 class="text-lg font-bold text-slate-800 mb-4">新增兼職與班表安排</h3>
                    <form onsubmit="app.savePartTimeRecord(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">日期</label>
                            <input type="date" id="m-pt-date" value="${todayStr}" required class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">班別選擇</label>
                                <select id="m-pt-shifttype" onchange="app.onShiftTypeChange(this.value)" class="w-full px-3 py-2 border rounded-xl text-sm">
                                    <option value="早班">早班</option>
                                    <option value="中班">中班</option>
                                    <option value="晚班" selected>晚班</option>
                                    <option value="自訂">自訂時間</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">上班時段顯示</label>
                                <input type="text" id="m-pt-shifttime" value="18:00-22:00" placeholder="例如：09:00-13:00" required class="w-full px-3 py-2 border rounded-xl text-sm">
                            </div>
                        </div>

                        <div id="custom-time-picker" class="hidden grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">開始時間</label>
                                <input type="time" id="m-pt-start" value="18:00" onchange="app.updateShiftTimeStr()" class="w-full px-2 py-1.5 border rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">結束時間</label>
                                <input type="time" id="m-pt-end" value="22:00" onchange="app.updateShiftTimeStr()" class="w-full px-2 py-1.5 border rounded-lg text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">實際工時 (小時)</label>
                            <input type="number" step="0.5" id="m-pt-hours" placeholder="手動輸入實際數值" required class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>

                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="m-pt-holiday" class="w-4 h-4 text-indigo-600 rounded">
                            <label for="m-pt-holiday" class="text-xs font-semibold text-slate-700">國定假日雙倍薪資</label>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">備註</label>
                            <input type="text" id="m-pt-memo" placeholder="例如：門市支援" class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl text-sm font-medium">取消</button>
                            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold">儲存紀錄</button>
                        </div>
                    </form>
                `);
            }

            onShiftTypeChange(val) {
                const shiftTimeInput = document.getElementById('m-pt-shifttime');
                const customPicker = document.getElementById('custom-time-picker');

                if (val === '早班') {
                    shiftTimeInput.value = '08:00-12:00';
                    customPicker.classList.add('hidden');
                } else if (val === '中班') {
                    shiftTimeInput.value = '12:00-17:00';
                    customPicker.classList.add('hidden');
                } else if (val === '晚班') {
                    shiftTimeInput.value = '18:00-22:00';
                    customPicker.classList.add('hidden');
                } else {
                    customPicker.classList.remove('hidden');
                    this.updateShiftTimeStr();
                }
            }

            updateShiftTimeStr() {
                const start = document.getElementById('m-pt-start').value;
                const end = document.getElementById('m-pt-end').value;
                if (start && end) {
                    document.getElementById('m-pt-shifttime').value = `${start}-${end}`;
                }
            }

            savePartTimeRecord(e) {
                e.preventDefault();
                const record = {
                    id: 'pt_' + Date.now(),
                    date: document.getElementById('m-pt-date').value,
                    shiftType: document.getElementById('m-pt-shifttype').value,
                    shiftTime: document.getElementById('m-pt-shifttime').value,
                    hours: parseFloat(document.getElementById('m-pt-hours').value) || 0,
                    isNationalHoliday: document.getElementById('m-pt-holiday').checked,
                    memo: document.getElementById('m-pt-memo').value
                };
                this.data.partTimeRecords.push(record);
                closeModal();
                this.saveState();
                showToast('已新增兼職與排班紀錄', 'check-circle');
            }

            deletePartTimeRecord(id) {
                this.data.partTimeRecords = this.data.partTimeRecords.filter(r => r.id !== id);
                this.saveState();
                showToast('已刪除兼職紀錄', 'trash-2');
            }

            openScheduleModal(editId = null) {
                const todayStr = DateUtils.formatYMD(new Date());
                let editSch = null;

                if (editId) {
                    editSch = this.data.schedules.find(s => s.id === editId);
                }

                const initialDate = editSch ? editSch.date : todayStr;
                const initialTitle = editSch ? editSch.title : '';
                const initialCat = editSch ? editSch.category : 'Trip';
                const initialMemo = editSch ? editSch.memo || '' : '';
                const initialSlotType = editSch ? (editSch.timeSlotType || '全天') : '全天';
                const initialTimeSlot = editSch ? (editSch.timeSlot || '') : '';

                openModal(`
                    <h3 class="text-lg font-bold text-slate-800 mb-4">${editSch ? '編輯行程規劃' : '新增行程規劃'}</h3>
                    <form onsubmit="app.saveSchedule(event, '${editId || ''}')" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">日期</label>
                            <input type="date" id="m-sc-date" value="${initialDate}" required class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">行程名稱</label>
                            <input type="text" id="m-sc-title" value="${initialTitle}" required placeholder="例如：陽明山賞花" class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        
                        <!-- New Time Slot Selection -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">行程時段選擇</label>
                                <select id="m-sc-slottype" onchange="app.onScheduleSlotTypeChange(this.value)" class="w-full px-3 py-2 border rounded-xl text-sm">
                                    <option value="全天" ${initialSlotType === '全天' ? 'selected' : ''}>全天</option>
                                    <option value="早晨" ${initialSlotType === '早晨' ? 'selected' : ''}>早晨</option>
                                    <option value="上午" ${initialSlotType === '上午' ? 'selected' : ''}>上午</option>
                                    <option value="下午" ${initialSlotType === '下午' ? 'selected' : ''}>下午</option>
                                    <option value="晚上" ${initialSlotType === '晚上' ? 'selected' : ''}>晚上</option>
                                    <option value="自訂時間" ${initialSlotType === '自訂時間' ? 'selected' : ''}>自訂時間</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">時段補充說明/具體時間</label>
                                <input type="text" id="m-sc-timeslot" value="${initialTimeSlot}" placeholder="如：09:00 - 12:00" class="w-full px-3 py-2 border rounded-xl text-sm">
                            </div>
                        </div>

                        <div id="sc-custom-time-picker" class="${initialSlotType === '自訂時間' ? '' : 'hidden'} grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">開始時間</label>
                                <input type="time" id="m-sc-start" value="09:00" onchange="app.updateScheduleTimeStr()" class="w-full px-2 py-1.5 border rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">結束時間</label>
                                <input type="time" id="m-sc-end" value="12:00" onchange="app.updateScheduleTimeStr()" class="w-full px-2 py-1.5 border rounded-lg text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">分類</label>
                            <select id="m-sc-category" class="w-full px-3 py-2 border rounded-xl text-sm">
                                <option value="Trip" ${initialCat === 'Trip' ? 'selected' : ''}>出遊 (Trip)</option>
                                <option value="Friends" ${initialCat === 'Friends' ? 'selected' : ''}>朋友 (Friends)</option>
                                <option value="Family" ${initialCat === 'Family' ? 'selected' : ''}>家人 (Family)</option>
                                <option value="Tasks" ${initialCat === 'Tasks' ? 'selected' : ''}>事情 (Tasks)</option>
                                <option value="Other" ${initialCat === 'Other' ? 'selected' : ''}>其他 (Other)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">備忘</label>
                            <input type="text" id="m-sc-memo" value="${initialMemo}" placeholder="攜帶雨具..." class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl text-sm font-medium">取消</button>
                            <button type="submit" class="px-4 py-2 bg-amber-500 text-white rounded-xl text-sm font-semibold">${editSch ? '更新行程' : '新增行程'}</button>
                        </div>
                    </form>
                `);
            }

            onScheduleSlotTypeChange(val) {
                const customPicker = document.getElementById('sc-custom-time-picker');

                if (val === '自訂時間') {
                    customPicker.classList.remove('hidden');
                    this.updateScheduleTimeStr();
                } else {
                    customPicker.classList.add('hidden');
                }
            }

            updateScheduleTimeStr() {
                const start = document.getElementById('m-sc-start').value;
                const end = document.getElementById('m-sc-end').value;
                if (start && end) {
                    document.getElementById('m-sc-timeslot').value = `${start} - ${end}`;
                }
            }

            saveSchedule(e, editId = '') {
                e.preventDefault();
                const newSchedule = {
                    id: editId ? editId : ('sc_' + Date.now()),
                    date: document.getElementById('m-sc-date').value,
                    title: document.getElementById('m-sc-title').value,
                    timeSlotType: document.getElementById('m-sc-slottype').value,
                    timeSlot: document.getElementById('m-sc-timeslot').value,
                    category: document.getElementById('m-sc-category').value,
                    memo: document.getElementById('m-sc-memo').value
                };

                if (editId) {
                    const idx = this.data.schedules.findIndex(s => s.id === editId);
                    if (idx !== -1) {
                        this.data.schedules[idx] = newSchedule;
                    }
                } else {
                    this.data.schedules.push(newSchedule);
                }

                closeModal();
                this.saveState();
                showToast(editId ? '已更新行程內容' : '已新增行程', 'check-circle');
            }

            deleteSchedule(id) {
                this.data.schedules = this.data.schedules.filter(s => s.id !== id);
                this.saveState();
                showToast('已刪除行程', 'trash-2');
            }

            openExtraIncomeModal() {
                const todayStr = DateUtils.formatYMD(new Date());
                openModal(`
                    <h3 class="text-lg font-bold text-slate-800 mb-4">紀錄當日額外收入</h3>
                    <form onsubmit="app.saveExtraIncome(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">日期</label>
                            <input type="date" id="m-ei-date" value="${todayStr}" required class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">外送收入</label>
                                <input type="number" id="m-ei-delivery" value="0" class="w-full px-3 py-2 border rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">小費</label>
                                <input type="number" id="m-ei-tips" value="0" class="w-full px-3 py-2 border rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">其他</label>
                                <input type="number" id="m-ei-other" value="0" class="w-full px-3 py-2 border rounded-xl text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">備註</label>
                            <input type="text" id="m-ei-memo" placeholder="例如：外送3單" class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl text-sm font-medium">取消</button>
                            <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-semibold">儲存收入</button>
                        </div>
                    </form>
                `);
            }

            saveExtraIncome(e) {
                e.preventDefault();
                this.data.extraIncomes.push({
                    id: 'ei_' + Date.now(),
                    date: document.getElementById('m-ei-date').value,
                    foodDelivery: parseFloat(document.getElementById('m-ei-delivery').value) || 0,
                    tips: parseFloat(document.getElementById('m-ei-tips').value) || 0,
                    other: parseFloat(document.getElementById('m-ei-other').value) || 0,
                    memo: document.getElementById('m-ei-memo').value
                });
                closeModal();
                this.saveState();
                showToast('已新增當日額外收入', 'check-circle');
            }

            deleteExtraIncome(id) {
                this.data.extraIncomes = this.data.extraIncomes.filter(e => e.id !== id);
                this.saveState();
                showToast('已刪除收入紀錄', 'trash-2');
            }

            openCsTargetModal() {
                openModal(`
                    <h3 class="text-lg font-bold text-slate-800 mb-4">設定年度社勞總目標時數</h3>
                    <form onsubmit="app.saveCsTarget(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">年度目標時數 (小時)</label>
                            <input type="number" id="m-cs-target" value="${this.data.communitySettings.annualTargetHours}" required class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl text-sm font-medium">取消</button>
                            <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-semibold">儲存目標</button>
                        </div>
                    </form>
                `);
            }

            saveCsTarget(e) {
                e.preventDefault();
                this.data.communitySettings.annualTargetHours = parseFloat(document.getElementById('m-cs-target').value) || 100;
                closeModal();
                this.saveState();
                showToast('年度目標時數已更新', 'check-circle');
            }

            openCommunityModal() {
                const todayStr = DateUtils.formatYMD(new Date());
                openModal(`
                    <h3 class="text-lg font-bold text-slate-800 mb-4">新增社會勞動紀錄</h3>
                    <form onsubmit="app.saveCommunityRecord(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">日期</label>
                            <input type="date" id="m-cs-date" value="${todayStr}" required class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">服務項目 / 內容</label>
                            <input type="text" id="m-cs-title" required placeholder="例如：社區公園淨灘" class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">預估時數 (小時)</label>
                            <input type="number" step="0.5" id="m-cs-hours" required placeholder="輸入預計時數" class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">備註</label>
                            <input type="text" id="m-cs-memo" placeholder="活動備註..." class="w-full px-3 py-2 border rounded-xl text-sm">
                        </div>
                        <div class="p-3 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-800">
                            提示：新增紀錄狀態預設為「預計安排 (pending)」，需點擊「確認完成」核入累積時數。
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl text-sm font-medium">取消</button>
                            <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-semibold">建立預計安排</button>
                        </div>
                    </form>
                `);
            }

            saveCommunityRecord(e) {
                e.preventDefault();
                this.data.communityRecords.push({
                    id: 'cs_' + Date.now(),
                    date: document.getElementById('m-cs-date').value,
                    title: document.getElementById('m-cs-title').value,
                    hours: parseFloat(document.getElementById('m-cs-hours').value) || 0,
                    status: 'pending',
                    memo: document.getElementById('m-cs-memo').value
                });
                closeModal();
                this.saveState();
                showToast('已建立社勞預計安排紀錄', 'check-circle');
            }

            confirmCsCompletion(id) {
                const rec = this.data.communityRecords.find(r => r.id === id);
                if (rec) {
                    rec.status = 'completed';
                    this.saveState();
                    showToast(`已核入完成時數 ${rec.hours} 小時！`, 'award');
                }
            }

            deleteCommunityRecord(id) {
                this.data.communityRecords = this.data.communityRecords.filter(r => r.id !== id);
                this.saveState();
                showToast('已刪除社勞紀錄', 'trash-2');
            }

            // Export / Import
            exportData() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.data, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `WorkLife_Backup_${DateUtils.formatYMD(new Date())}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast('已成功匯出 JSON 資料', 'download');
            }

            importData(event) {
                const fileReader = new FileReader();
                fileReader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        this.data = parsed;
                        this.saveState();
                        showToast('成功匯入資料並更新', 'check-circle');
                    } catch (err) {
                        showToast('匯入失敗：格式不正確', 'alert-circle');
                    }
                };
                if(event.target.files[0]) {
                    fileReader.readAsText(event.target.files[0]);
                }
            }

            resetDemoData() {
                if (confirm('確定要將所有資料重置為預設示範資料嗎？')) {
                    this.resetDemo();
                }
            }
        }

        function openModal(htmlContent) {
            const backdrop = document.getElementById('modal-backdrop');
            const content = document.getElementById('modal-content');
            content.innerHTML = htmlContent;
            backdrop.classList.remove('hidden');
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            backdrop.classList.add('hidden');
        }

        function showToast(message, iconName = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;
            toastIcon.setAttribute('data-lucide', iconName);
            lucide.createIcons();

            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
            }, 2500);
        }

        // App Initialization
        let app;
        window.onload = function() {
            app = new AppState();
            app.render();

            document.getElementById('modal-backdrop').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
        };
    </script>
</body>
</html>
