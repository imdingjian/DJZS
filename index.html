<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between pb-16 md:pb-0">

    <!-- Top Navigation for Desktop -->
    <header class="hidden md:block bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">

    <script>
        // Helper Date Utility
        const DateUtils = {
            formatYMD(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            },
            getDaysInMonth(year, month) {
                return new Date(year, month + 1, 0).getDate();
            },
            getCalendarGrid(year, month) {
                const firstDay = new Date(year, month, 1);
                let dayOfWeek = firstDay.getDay(); 
                dayOfWeek = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // Mon=0 ... Sun=6

                const daysInMonth = this.getDaysInMonth(year, month);
                const prevMonthDays = new Date(year, month, 0).getDate();

                const grid = [];
                for (let i = dayOfWeek - 1; i >= 0; i--) {
                    grid.push({
                        day: prevMonthDays - i,
                        currentMonth: false,
                        dateStr: this.formatYMD(new Date(year, month - 1, prevMonthDays - i))
                    });
                }
                for (let d = 1; d <= daysInMonth; d++) {
                    grid.push({
                        day: d,
                        currentMonth: true,
                        dateStr: this.formatYMD(new Date(year, month, d))
                    });
                }
                const totalCells = grid.length > 35 ? 42 : 35;
                const remaining = totalCells - grid.length;
                for (let d = 1; d <= remaining; d++) {
                    grid.push({
                        day: d,
                        currentMonth: false,
                        dateStr: this.formatYMD(new Date(year, month + 1, d))
                    });
                }
                return grid;
            },
            getWeekRange(referenceDate, weekOffset = 0) {
                const date = new Date(referenceDate);
                const day = date.getDay();
                const diffToMonday = (day === 0 ? -6 : 1 - day);
                
                const monday = new Date(date);
                monday.setDate(date.getDate() + diffToMonday + (weekOffset * 7));
                
                const days = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(monday);
                    d.setDate(monday.getDate() + i);
                    days.push(this.formatYMD(d));
                }

                return {
                    mondayStr: days[0],
                    sundayStr: days[6],
                    days: days
                };
            },
            calculateSeniority(onboardingDateStr) {
                if (!onboardingDateStr) return { years: 0, months: 0, days: 0, text: '未設定' };
                const startDate = new Date(onboardingDateStr);
                const endDate = new Date();
                if (isNaN(startDate.getTime()) || startDate > endDate) {
                    return { years: 0, months: 0, days: 0, text: '日期不正確' };
                }

                let years = endDate.getFullYear() - startDate.getFullYear();
                let months = endDate.getMonth() - startDate.getMonth();
                let days = endDate.getDate() - startDate.getDate();

                if (days < 0) {
                    months--;
                    const lastMonth = new Date(endDate.getFullYear(), endDate.getMonth(), 0);
                    days += lastMonth.getDate();
                }
                if (months < 0) {
                    years--;
                    months += 12;
                }

                return {
                    years, months, days,
                    text: `${years} 年 ${months} 個月 ${days} 天`
                };
            }
        };

        const NAV_ITEMS = [
            { id: 'dashboard', label: '總表', icon: 'layout-dashboard' },
            { id: 'work', label: '工作', icon: 'briefcase' },
            { id: 'parttime', label: '兼職', icon: 'clock' },
            { id: 'schedule', label: '行程與當日', icon: 'calendar' },
            { id: 'community', label: '社勞', icon: 'heart-handshake' },
        ];

        const INITIAL_STATE = {
            currentTab: 'dashboard',
            currentYear: new Date().getFullYear(),
            currentMonth: new Date().getMonth(),
            selectedWeekOffset: 0,
            workSettings: {
                monthlySalary: 38000,
                dailyHours: 8,
                overtimeRate1: 1.34, 
                restDayRate1: 1.34,  
                restDayRate2: 1.67,
                onboardingDate: `${new Date().getFullYear() - 1}-03-15`,
                laborInsuranceDeduction: 1050,
                healthInsuranceDeduction: 580
            },
            workRecords: {
                [`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-02`]: {
                    type: 'work', checkIn: '09:00', checkOut: '19:30', overtimeHours: 2.5, memo: '處理季報資料'
                },
                [`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-05`]: {
                    type: 'leave', leaveType: '特休', memo: '身體微恙休息'
                },
                [`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-12`]: {
                    type: 'rest_overtime', restDayHours: 6, memo: '週六專案緊急加班'
                }
            },
            partTimeSettings: {
                hourlyRate: 190,
                holidayRateMultiplier: 2.0
            },
            partTimeRecords: [
                { id: 'pt1', date: `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-03`, shiftTime: '18:00-22:30', shiftType: '晚班', hours: 4.5, isNationalHoliday: false, memo: '晚班咖啡廳打工' },
                { id: 'pt2', date: `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-10`, shiftTime: '10:00-16:00', shiftType: '中班', hours: 6.0, isNationalHoliday: true, memo: '國定假日支援門市' }
            ],
            schedules: [
                { id: 'sc1', date: `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-15`, timeSlotType: '全天', timeSlot: '全天', title: '陽明山踏青賞花', category: 'Trip', memo: '記得攜帶雨具' },
                { id: 'sc2', date: `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-20`, timeSlotType: '晚上', timeSlot: '19:00 - 21:30', title: '高中同學聚餐', category: 'Friends', memo: '預約晚上7點' }
            ],
            extraIncomes: [
                { id: 'ei1', date: `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-02`, foodDelivery: 450, tips: 100, other: 0, memo: '外送兼職3單' },
                { id: 'ei2', date: `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-08`, foodDelivery: 600, tips: 50, other: 200, memo: '二手書出清與外送' }
            ],
            communitySettings: {
                annualTargetHours: 100
            },
            communityRecords: [
                { id: 'cs1', date: `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-04`, title: '社區圖書館書籍整理', hours: 4, status: 'completed', memo: '完成4小時協助分類' },
                { id: 'cs2', date: `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-18`, title: '環境清潔志工', hours: 3, status: 'pending', memo: '已預約，待服務' },
                { id: 'cs3', date: `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-25`, title: '長者關懷陪伴', hours: 5, status: 'pending', memo: '週六上午志工活動' }
            ]
        };

        class AppState {
            constructor() {
                this.loadState();
            }

            loadState() {
                const saved = localStorage.getItem('WORKLIFE_HUB_DATA_V5');
                if (saved) {
                    try {
                        this.data = JSON.parse(saved);
                        if (this.data.selectedWeekOffset === undefined) this.data.selectedWeekOffset = 0;
                        if (!this.data.workSettings.laborInsuranceDeduction) this.data.workSettings.laborInsuranceDeduction = 1050;
                        if (!this.data.workSettings.healthInsuranceDeduction) this.data.workSettings.healthInsuranceDeduction = 580;
                    } catch (e) {
                        console.error('Failed to parse state, resetting...', e);
                        this.data = JSON.parse(JSON.stringify(INITIAL_STATE));
                    }
                } else {
                    this.data = JSON.parse(JSON.stringify(INITIAL_STATE));
                }
            }

            saveState() {
                localStorage.setItem('WORKLIFE_HUB_DATA_V5', JSON.stringify(this.data));
                this.render();
            }

            resetDemo() {
                this.data = JSON.parse(JSON.stringify(INITIAL_STATE));
                this.saveState();
                showToast('已重置為預設示範資料', 'rotate-ccw');
            }

            render() {
                document.getElementById('current-month-display').innerText = 
                    `${this.data.currentYear}年 ${String(this.data.currentMonth + 1).padStart(2, '0')}月`;

                this.renderNav();

                const viewEl = document.getElementById('app-view');
                switch (this.data.currentTab) {
                    case 'dashboard': viewEl.innerHTML = this.renderDashboardView(); break;
                    case 'work': viewEl.innerHTML = this.renderWorkView(); break;
                    case 'parttime': viewEl.innerHTML = this.renderPartTimeView(); break;
                    case 'schedule': viewEl.innerHTML = this.renderScheduleAndIncomeView(); break;
                    case 'community': viewEl.innerHTML = this.renderCommunityView(); break;
                    default: viewEl.innerHTML = this.renderDashboardView();
                }

                lucide.createIcons();
            }

            renderNav() {
                const desktopContainer = document.getElementById('desktop-nav');
                const mobileContainer = document.getElementById('mobile-nav');

                desktopContainer.innerHTML = NAV_ITEMS.map(item => `
                    <button onclick="app.setTab('${item.id}')" 
                        class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium transition ${
                            this.data.currentTab === item.id 
                            ? 'bg-brand-50 text-brand-600 font-semibold shadow-sm' 
                            : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                        }">
                        <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                        ${item.label}
                    </button>
                `).join('');

                mobileContainer.innerHTML = NAV_ITEMS.map(item => `
                    <button onclick="app.setTab('${item.id}')" 
                        class="flex flex-col items-center py-1 px-3 rounded-lg text-xs transition ${
                            this.data.currentTab === item.id ? 'text-brand-600 font-bold' : 'text-slate-500'
                        }">
                        <i data-lucide="${item.icon}" class="w-5 h-5 mb-0.5"></i>
                        <span>${item.label}</span>
                    </button>
                `).join('');
            }

            setTab(tabId) {
                this.data.currentTab = tabId;
                this.saveState();
            }

            changeMonth(delta) {
                let m = this.data.currentMonth + delta;
                let y = this.data.currentYear;
                if (m < 0) { m = 11; y--; }
                if (m > 11) { m = 0; y++; }
                this.data.currentMonth = m;
                this.data.currentYear = y;
                this.saveState();
            }

            changeWeekOffset(delta) {
                this.data.selectedWeekOffset = (this.data.selectedWeekOffset || 0) + delta;
                this.saveState();
            }

            resetWeekOffset() {
                this.data.selectedWeekOffset = 0;
                this.saveState();
            }

            resetToToday() {
                const today = new Date();
                this.data.currentYear = today.getFullYear();
                this.data.currentMonth = today.getMonth();
                this.data.selectedWeekOffset = 0;
                this.saveState();
            }

            getMonthlyCalculations(year = this.data.currentYear, month = this.data.currentMonth) {
                const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
                
                // 1. Work Income
                const hourlyWorkRate = (this.data.workSettings.monthlySalary / 30 / this.data.workSettings.dailyHours);
                let overtimeIncome = 0;
                let leaveDays = 0;

                Object.entries(this.data.workRecords).forEach(([dateStr, record]) => {
                    if (dateStr.startsWith(prefix)) {
                        if (record.type === 'work' && record.overtimeHours) {
                            overtimeIncome += parseFloat(record.overtimeHours) * hourlyWorkRate * (this.data.workSettings.overtimeRate1 || 1.34);
                        } else if (record.type === 'rest_overtime' && record.restDayHours) {
                            const hrs = parseFloat(record.restDayHours);
                            const r1 = this.data.workSettings.restDayRate1 || 1.34;
                            const r2 = this.data.workSettings.restDayRate2 || 1.67;
                            if (hrs <= 2) {
                                overtimeIncome += hrs * hourlyWorkRate * r1;
                            } else {
                                overtimeIncome += (2 * hourlyWorkRate * r1) + ((hrs - 2) * hourlyWorkRate * r2);
                            }
                        } else if (record.type === 'leave') {
                            leaveDays += 1;
                        }
                    }
                });

                const laborDeduction = parseFloat(this.data.workSettings.laborInsuranceDeduction) || 0;
                const healthDeduction = parseFloat(this.data.workSettings.healthInsuranceDeduction) || 0;
                const totalMonthlyDeduction = laborDeduction + healthDeduction;

                const grossWorkIncome = Math.round(this.data.workSettings.monthlySalary + overtimeIncome);
                const netWorkIncome = grossWorkIncome - totalMonthlyDeduction;

                // 2. Part-Time Income
                let totalPtIncome = 0;
                this.data.partTimeRecords.forEach(rec => {
                    if (rec.date.startsWith(prefix)) {
                        const rate = rec.isNationalHoliday 
                            ? this.data.partTimeSettings.hourlyRate * this.data.partTimeSettings.holidayRateMultiplier 
                            : this.data.partTimeSettings.hourlyRate;
                        totalPtIncome += (rec.hours || 0) * rate;
                    }
                });
                totalPtIncome = Math.round(totalPtIncome);

                // 3. Extra Income
                let totalExtraIncome = 0;
                this.data.extraIncomes.forEach(rec => {
                    if (rec.date.startsWith(prefix)) {
                        totalExtraIncome += (rec.foodDelivery || 0) + (rec.tips || 0) + (rec.other || 0);
                    }
                });

                // 4. Community Service
                let monthlyCompletedCsHours = 0;
                let monthlyPendingCsHours = 0;

                this.data.communityRecords.forEach(rec => {
                    if (rec.date.startsWith(prefix)) {
                        if (rec.status === 'completed') {
                            monthlyCompletedCsHours += (rec.hours || 0);
                        } else if (rec.status === 'pending') {
                            monthlyPendingCsHours += (rec.hours || 0);
                        }
                    }
                });

                let annualCompletedCsHours = 0;
                const yearPrefix = `${year}-`;
                this.data.communityRecords.forEach(rec => {
                    if (rec.date.startsWith(yearPrefix) && rec.status === 'completed') {
                        annualCompletedCsHours += (rec.hours || 0);
                    }
                });

                return {
                    grossWorkIncome,
                    netWorkIncome,
                    monthlyDeduction: totalMonthlyDeduction,
                    laborDeduction,
                    healthDeduction,
                    partTimeIncome: totalPtIncome,
                    extraIncome: totalExtraIncome,
                    totalIncome: netWorkIncome + totalPtIncome + totalExtraIncome,
                    grossTotalIncome: grossWorkIncome + totalPtIncome + totalExtraIncome,
                    leaveDays,
                    monthlyCsHours: monthlyCompletedCsHours,
                    monthlyPendingCsHours: monthlyPendingCsHours,
                    annualCsHours: annualCompletedCsHours,
                    csTarget: this.data.communitySettings.annualTargetHours
                };
            }

            getAnnualCalculations(year = this.data.currentYear) {
                let annualTotalIncome = 0;
                let annualTotalDeductions = 0;

                for (let m = 0; m < 12; m++) {
                    const mCalc = this.getMonthlyCalculations(year, m);
                    annualTotalIncome += mCalc.grossTotalIncome;
                    annualTotalDeductions += mCalc.monthlyDeduction;
                }

                return {
                    annualTotalIncome,
                    annualTotalDeductions
                };
            }

            renderDashboardView() {
                const stats = this.getMonthlyCalculations();
                const annualStats = this.getAnnualCalculations();
                const grid = DateUtils.getCalendarGrid(this.data.currentYear, this.data.currentMonth);
                const csProgress = Math.min(100, Math.round((stats.annualCsHours / stats.csTarget) * 100));

                const today = new Date();
                const weekOffset = this.data.selectedWeekOffset || 0;
                const weekRange = DateUtils.getWeekRange(today, weekOffset);
                const weekDaysName = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];

                return `
                    <div class="space-y-6">
                        <!-- Top Overview Stats Grid -->
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3">
                           
                            <div class="bg-gradient-to-br from-brand-500 to-sky-600 p-3.5 rounded-2xl shadow-md text-white flex flex-col">
                                <span class="text-[11px] text-sky-100 font-medium">年度總收入</span>
                                <span class="text-lg font-bold mt-1">$${annualStats.annualTotalIncome.toLocaleString()}</span>
                                <span class="text-[10px] text-sky-200 mt-0.5">${this.data.currentYear} 全年預估</span>
                            </div>
                            <div class="bg-gradient-to-br from-rose-500 to-pink-600 p-3.5 rounded-2xl shadow-md text-white flex flex-col">
                                <span class="text-[11px] text-rose-100 font-medium">年度執行扣款</span>
                                <span class="text-lg font-bold mt-1">$${annualStats.annualTotalDeductions.toLocaleString()}</span>
                                <span class="text-[10px] text-rose-200 mt-0.5">全年度勞健保扣款</span>
                            </div>
                            <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
                                <span class="text-[11px] text-slate-500 font-medium">當月總淨收入</span>
                                <span class="text-lg font-bold text-slate-900 mt-1">$${stats.totalIncome.toLocaleString()}</span>
                                <span class="text-[10px] text-emerald-600 mt-0.5 flex items-center gap-0.5"><i data-lucide="trending-up" class="w-3 h-3"></i>已扣除勞健保</span>
                            </div>

                        <!-- Integrated Calendar View -->

                                    綜合月曆 (Monday First)
                                </h3>
                                <div class="flex flex-wrap gap-2 text-xs">
                                    <span class="px-2 py-0.5 rounded bg-brand-100 text-brand-700">工作/請假/休息加班</span>
                                    <span class="px-2 py-0.5 rounded bg-indigo-100 text-indigo-700">兼職時段</span>
                                    <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-700">行程(時段+名稱)</span>

                                </div>

                            <div class="grid grid-cols-7 gap-1 md:gap-2 mt-2">
                                ${grid.map(cell => {
                                    const dateStr = cell.dateStr;

                                    const work = this.data.workRecords[dateStr];
                                    const pts = this.data.partTimeRecords.filter(p => p.date === dateStr);
                                    const schs = this.data.schedules.filter(s => s.date === dateStr);
                                    const csCompleted = this.data.communityRecords.filter(c => c.date === dateStr && c.status === 'completed');

                                    return `
                                        <div class="min-h-[85px] md:min-h-[105px] p-1 md:p-2 border rounded-xl flex flex-col justify-between transition ${
                                            cell.currentMonth ? 'bg-white border-slate-100' : 'bg-slate-50/50 border-transparent text-slate-300'
                                        } ${isToday ? 'ring-2 ring-brand-500 bg-brand-50/20' : ''}">
                                            <div class="flex justify-between items-center">
                                                <span class="text-xs font-semibold ${isToday ? 'bg-brand-500 text-white px-1.5 py-0.5 rounded-full' : cell.currentMonth ? 'text-slate-700' : 'text-slate-300'}">
                                                    ${cell.day}
                                                </span>
                                            </div>
                                            
                                            <div class="space-y-1 my-1 flex-grow overflow-hidden text-[10px]">
                                                ${work ? `
                                                    <div class="px-1 py-0.5 rounded truncate ${
                                                        work.type==='work' ? 'bg-brand-50 text-brand-700' : 
                                                        work.type==='rest_overtime' ? 'bg-purple-50 text-purple-700 font-semibold' : 'bg-rose-50 text-rose-700'
                                                    }">
                                                        ${work.type==='work'? `班:${work.checkIn||''}` : work.type==='rest_overtime'? `休加:${work.restDayHours}h` : `假:${work.leaveType||''}`}
                                                    </div>
                                                `:''}
                                                ${pts.map(p => `
                                                    <div class="px-1 py-0.5 rounded bg-indigo-50 text-indigo-700 font-medium truncate" title="${p.shiftType || '兼職'}: ${p.shiftTime || p.hours + 'h'}">
                                                        PT: ${p.shiftTime || (p.shiftType ? p.shiftType : p.hours + 'h')}
                                                    </div>
                                                `).join('')}
                                                ${schs.map(s => `
                                                    <div class="px-1 py-0.5 rounded bg-amber-50 text-amber-900 truncate" title="[${s.timeSlotType || '全天'} / ${s.timeSlot || '全天'}] ${s.title}">
                                                        [${s.timeSlotType || s.timeSlot || '全天'}] ${s.title}
                                                    </div>
                                                `).join('')}

                                                    <div class="px-1 py-0.5 rounded bg-emerald-50 text-emerald-800 font-medium truncate">
                                                        社勞:${c.hours}h
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- Weekly Summary Section -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                                <div class="flex items-center gap-2">
                                    <div class="p-2 bg-indigo-50 text-indigo-600 rounded-xl">
                                        <i data-lucide="list-todo" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 class="text-lg font-bold text-slate-800">當週行程統整</h3>
                                        <p class="text-xs text-slate-500">${weekRange.mondayStr} ~ ${weekRange.sundayStr}</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="app.changeWeekOffset(-1)" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition flex items-center gap-1">
                                        <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i> 上週
                                    </button>
                                    <button onclick="app.resetWeekOffset()" class="px-3 py-1.5 text-xs font-semibold ${weekOffset === 0 ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'} rounded-xl transition">
                                        本週
                                    </button>
                                    <button onclick="app.changeWeekOffset(1)" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition flex items-center gap-1">
                                        下週 <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-7 gap-3">
                                ${weekRange.days.map((dateStr, idx) => {
                                    const isToday = dateStr === DateUtils.formatYMD(new Date());
                                    const work = this.data.workRecords[dateStr];
                                    const pts = this.data.partTimeRecords.filter(p => p.date === dateStr);
                                    const schs = this.data.schedules.filter(s => s.date === dateStr);
                                    const csRecs = this.data.communityRecords.filter(c => c.date === dateStr);
                                    const extraInc = this.data.extraIncomes.find(e => e.date === dateStr);

                                    const hasItems = work || pts.length > 0 || schs.length > 0 || csRecs.length > 0 || extraInc;

                                    return `
                                        <div class="p-3 rounded-xl border ${isToday ? 'border-brand-500 bg-brand-50/10' : 'border-slate-100 bg-slate-50/50'} flex flex-col justify-between">
                                            <div>
                                                <div class="flex items-center justify-between mb-2 pb-1 border-b border-slate-200/60">
                                                    <span class="text-xs font-bold ${idx >= 5 ? 'text-rose-500' : 'text-slate-700'}">${weekDaysName[idx]}</span>
                                                    <span class="text-[11px] font-semibold text-slate-400">${dateStr.slice(5)}</span>
                                                </div>

                                                ${!hasItems ? `
                                                    <p class="text-[11px] text-slate-300 italic text-center py-3">無安排</p>
                                                ` : `
                                                    <div class="space-y-1.5 text-xs">
                                                        ${work ? `
                                                            <div class="p-1.5 rounded-lg text-[11px] ${
                                                                work.type==='work' ? 'bg-brand-100/70 text-brand-800' :
                                                                work.type==='rest_overtime' ? 'bg-purple-100/80 text-purple-800' : 'bg-rose-100/80 text-rose-800'
                                                            }">
                                                                <div class="font-bold flex items-center gap-1">
                                                                    <i data-lucide="briefcase" class="w-3 h-3"></i>
                                                                    ${work.type==='work'? '正職上班' : work.type==='rest_overtime'? '休息日加班' : '休假'}
                                                                </div>
                                                                <div class="text-[10px] opacity-90 mt-0.5">
                                                                    ${work.type==='work' ? `${work.checkIn||''}-${work.checkOut||''}` : 
                                                                      work.type==='rest_overtime' ? `${work.restDayHours}h` : work.leaveType}
                                                                </div>
                                                            </div>
                                                        ` : ''}

                                                        ${pts.map(p => `
                                                            <div class="p-1.5 rounded-lg bg-indigo-100/80 text-indigo-800 text-[11px]">
                                                                <div class="font-bold flex items-center gap-1">
                                                                    <i data-lucide="clock" class="w-3 h-3"></i> 兼職: ${p.shiftType || '打工'}
                                                                </div>
                                                                <div class="text-[10px] mt-0.5">${p.shiftTime || p.hours + 'h'}</div>
                                                            </div>
                                                        `).join('')}

                                                        ${schs.map(s => `
                                                            <div class="p-1.5 rounded-lg bg-amber-100/80 text-amber-900 text-[11px]">
                                                                <div class="font-semibold flex items-center gap-1">
                                                                    <i data-lucide="map-pin" class="w-3 h-3"></i> ${s.title}
                                                                </div>
                                                                <div class="text-[10px] text-amber-800 mt-0.5 font-medium">
                                                                    時段：<span class="px-1 bg-amber-200/70 rounded">${s.timeSlotType || '全天'}</span> ${s.timeSlot ? `(${s.timeSlot})` : ''}
                                                                </div>
                                                            </div>
                                                        `).join('')}

                                                        ${csRecs.map(c => `
                                                            <div class="p-1.5 rounded-lg text-[11px] ${c.status === 'completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-50 border border-amber-200 text-amber-800'}">
                                                                <div class="font-semibold flex items-center gap-1">
                                                                    <i data-lucide="heart-handshake" class="w-3 h-3"></i> 社勞 ${c.hours}h (${c.status === 'completed' ? '已核入' : '預計'})
                                                                </div>
                                                            </div>
                                                        `).join('')}

                                                        ${extraInc ? `
                                                            <div class="p-1.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-[10px] font-semibold">
                                                                外送收入: +$${(extraInc.foodDelivery || 0) + (extraInc.tips || 0) + (extraInc.other || 0)}
                                                            </div>
                                                        ` : ''}
                                                    </div>
                                                `}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- Visual Footer Label / Copyright -->
                        <div class="text-center py-4 text-xs font-semibold text-slate-400 border-t border-slate-200/60 mt-8 tracking-wider">
                            製作 IG：_1990.02.11_
                        </div>
                    </div>
                `;
            }

            renderWorkView() {
                const settings = this.data.workSettings;
                const monthPrefix = `${this.data.currentYear}-${String(this.data.currentMonth + 1).padStart(2, '0')}`;
                
                const records = Object.entries(this.data.workRecords)
                    .filter(([date]) => date.startsWith(monthPrefix))
                    .sort((a,b) => a[0].localeCompare(b[0]));

                const hourly = settings.monthlySalary / 30 / settings.dailyHours;
                const seniority = DateUtils.calculateSeniority(settings.onboardingDate);

                return `
                    <div class="space-y-6">
                        <!-- Top Section: Seniority Badge Card -->
                        <div class="bg-gradient-to-r from-brand-600 to-sky-700 text-white p-5 rounded-2xl shadow-sm flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center gap-3">
                                <div class="p-3 bg-white/10 backdrop-blur-md rounded-xl">
                                    <i data-lucide="user-check" class="w-6 h-6 text-sky-200"></i>
                                </div>
                                <div>
                                    <div class="text-xs text-sky-200 font-medium">當前職位年資 (依入職時間自動試算)</div>
                                    <div class="text-2xl font-bold mt-0.5">${seniority.text}</div>
                                </div>
                            </div>
                            <div class="text-xs bg-white/10 backdrop-blur-md px-3 py-2 rounded-xl border border-white/10">
                                入職日期：<span class="font-semibold">${settings.onboardingDate || '尚未設定'}</span>
                            </div>
                        </div>

                        <!-- Section 1: Attendance & Overtime Records Log -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                    <i data-lucide="clock" class="w-5 h-5 text-brand-500"></i> 排班打卡與加班紀錄
                                </h3>
                                <button onclick="app.openWorkRecordModal()" class="px-4 py-2 bg-brand-500 text-white rounded-xl text-sm font-semibold hover:bg-brand-600 transition flex items-center gap-2 shadow-sm">
                                    <i data-lucide="plus" class="w-4 h-4"></i> 新增/打卡紀錄
                                </button>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="border-b border-slate-100 text-xs font-semibold text-slate-400">
                                            <th class="py-3 px-2">日期</th>
                                            <th class="py-3 px-2">類型</th>
                                            <th class="py-3 px-2">出勤/請假內容</th>
                                            <th class="py-3 px-2">加班/休息日工時</th>
                                            <th class="py-3 px-2">備忘錄</th>
                                            <th class="py-3 px-2 text-right">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 text-sm">
                                        ${records.length === 0 ? `
                                            <tr><td colspan="6" class="py-8 text-center text-slate-400 text-sm">當月尚無出勤或加班紀錄</td></tr>
                                        ` : records.map(([date, rec]) => `
                                            <tr class="hover:bg-slate-50/50 transition">
                                                <td class="py-3 px-2 font-medium text-slate-800">${date}</td>
                                                <td class="py-3 px-2">
                                                    <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${
                                                        rec.type === 'work' ? 'bg-emerald-100 text-emerald-700' :
                                                        rec.type === 'rest_overtime' ? 'bg-purple-100 text-purple-700' : 'bg-rose-100 text-rose-700'
                                                    }">
                                                        ${rec.type === 'work' ? '正常上班' : rec.type === 'rest_overtime' ? '休息日加班' : '休假/請假'}
                                                    </span>
                                                </td>
                                                <td class="py-3 px-2 text-slate-600">
                                                    ${rec.type==='work' ? `${rec.checkIn || '--'} ~ ${rec.checkOut || '--'}` : 
                                                      rec.type==='rest_overtime' ? `<span class="text-purple-700 font-medium">休息日出勤 ${rec.restDayHours} 小時</span>` :
                                                      `<span class="font-medium text-rose-600">${rec.leaveType}</span>`}
                                                </td>
                                                <td class="py-3 px-2 font-semibold">
                                                    ${rec.type === 'work' ? (rec.overtimeHours ? `<span class="text-brand-600">平日 +${rec.overtimeHours}h</span>` : '-') :
                                                      rec.type === 'rest_overtime' ? `<span class="text-purple-600">休息日 +${rec.restDayHours}h</span>` : '-'}
                                                </td>
                                                <td class="py-3 px-2 text-slate-500 text-xs max-w-[150px] truncate">${rec.memo || '-'}</td>
                                                <td class="py-3 px-2 text-right">
                                                    <button onclick="app.deleteWorkRecord('${date}')" class="p-1 text-slate-400 hover:text-rose-600 transition">
                                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Section 2: Work & Salary Settings (Moved Below Attendance Records) -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                                <i data-lucide="settings" class="w-5 h-5 text-brand-500"></i> 正職薪資、入職日期與勞健保費率設定
                            </h3>
                            <form onsubmit="app.saveWorkSettings(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">入職時間 (用於計算年資)</label>
                                    <input type="date" id="ws-onboarding" value="${settings.onboardingDate || ''}" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">月薪 (NTD)</label>
                                    <input type="number" id="ws-salary" value="${settings.monthlySalary}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">每日標準工時 (小時)</label>
                                    <input type="number" step="0.5" id="ws-hours" value="${settings.dailyHours}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">勞保扣款 (每月 NTD)</label>
                                    <input type="number" id="ws-labor" value="${settings.laborInsuranceDeduction || 0}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">健保扣款 (每月 NTD)</label>
                                    <input type="number" id="ws-health" value="${settings.healthInsuranceDeduction || 0}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">平日加班費率 (前2小時)</label>
                                    <input type="number" step="0.01" id="ws-ot1" value="${settings.overtimeRate1 || 1.34}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">休息日加班前2h倍率</label>
                                    <input type="number" step="0.01" id="ws-rest1" value="${settings.restDayRate1 || 1.34}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">休息日加班第3-8h倍率</label>
                                    <input type="number" step="0.01" id="ws-rest2" value="${settings.restDayRate2 || 1.67}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div class="flex items-end">
                                    <button type="submit" class="w-full py-2.5 bg-brand-500 text-white text-sm font-semibold rounded-xl hover:bg-brand-600 transition shadow-sm">
                                        儲存設定與扣款
                                    </button>
                                </div>
                            </form>

                            <div class="mt-4 p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-600 grid grid-cols-1 md:grid-cols-3 gap-2">
                                <div><span class="font-semibold text-slate-800">標準時薪試算：</span>≈ NT$ ${hourly.toFixed(1)} / h</div>
                                <div><span class="font-semibold text-slate-800">每月總法定扣款：</span>NT$ ${(parseFloat(settings.laborInsuranceDeduction||0) + parseFloat(settings.healthInsuranceDeduction||0)).toLocaleString()}</div>
                                <div><span class="font-semibold text-slate-800">休息日加班費率：</span>1-2h (${settings.restDayRate1||1.34}x) / 3-8h (${settings.restDayRate2||1.67}x)</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderPartTimeView() {
                const settings = this.data.partTimeSettings;
                const monthPrefix = `${this.data.currentYear}-${String(this.data.currentMonth + 1).padStart(2, '0')}`;
                
                const records = this.data.partTimeRecords
                    .filter(r => r.date.startsWith(monthPrefix))
                    .sort((a,b) => a.date.localeCompare(b.date));

                return `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Part Time Settings -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                                <i data-lucide="dollar-sign" class="w-5 h-5 text-indigo-500"></i> 兼職時薪設定
                            </h3>
                            <form onsubmit="app.savePartTimeSettings(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">基本時薪 (NTD)</label>
                                    <input type="number" id="pt-rate" value="${settings.hourlyRate}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
